# /etc/nginx/sites-available/sprites.asleepace.com
# then: ln -s ../sites-available/sprites.asleepace.com /etc/nginx/sites-enabled/
#       certbot --nginx -d sprites.asleepace.com

# sites-enabled/ is included inside http {}, so these two lines are valid here (drop them if already defined)
limit_req_zone $binary_remote_addr zone=sprites:10m rate=10r/s;
log_format sprites_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name sprites.asleepace.com;
    # certbot rewrites this block to redirect to HTTPS
}

server {
    # listen 443 ssl; + ssl_certificate lines are added by certbot
    server_name sprites.asleepace.com;

    # tokens may arrive as ?key= (for <img> tags), so never log query strings
    access_log /var/log/nginx/sprites.access.log sprites_noquery;

    client_max_body_size 2m;
    limit_req zone=sprites burst=40 nodelay;

    # optional second layer: only your office / VPN / home IPs
    # allow 203.0.113.0/24;
    # deny all;

    location /mcp {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;          # MCP streams responses over SSE
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;      # big atlases take a few seconds on first render
    }
}
