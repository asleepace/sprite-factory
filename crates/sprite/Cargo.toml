[package]
name = "sprite"
description = "Sprite Factory CLI + MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sprite"
path = "src/main.rs"

[dependencies]
sprite-core = { path = "../sprite-core" }
serde_json = "1"
png = "0.18.1"
gif = "0.14.2"
base64 = "0.23.1"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
rmcp = { version = "3.6.0", features = ["server", "transport-io", "macros", "transport-streamable-http-server"] }
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "io-std", "signal", "net"] }
schemars = "1.2.3"
ureq = { version = "3.4.2", features = ["json"] }
axum = "0.8.9"
tower-http = { version = "0.7.1", features = ["cors", "limit"] }

[dev-dependencies]
rmcp = { version = "3.6.0", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
tokio = { version = "1.54.0", features = ["full"] }
